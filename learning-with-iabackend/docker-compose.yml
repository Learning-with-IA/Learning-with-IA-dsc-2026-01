version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning_nestjs_api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=learning_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: learning_postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=learning_db